[project]
name = "coursework-01"
version = "0.1.0"
description = ""
authors = [
    {name = "maxim0275",email = "maxim0275@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas (>=2.3.2,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "black (>=25.1.0,<26.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "babel (>=2.17.0,<3.0.0)",
    "pytest (==8.4.1)",
    "parameterized (>=0.9.0,<0.10.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
# максимальная длина строки
line_length = 119
# Файлы, которые не нужно форматировать


[tool.black]
# Максимальная длина строки
line-length = 119
exclude = '.git'

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'
[tool.poetry.group.dev.dependencies]
pytest-cov = "^6.2.1"

